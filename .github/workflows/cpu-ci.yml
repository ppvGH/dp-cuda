name: CPU CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        build_type:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure on Ubuntu
        if: runner.os == 'Linux'
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDP_CUDA_BUILD_TESTS=ON

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: >
          cmake
          -S .
          -B build
          -DDP_CUDA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: >
          ctest
          --test-dir build
          -C ${{ matrix.build_type }}
          --output-on-failure

  coverage:
    name: Ubuntu / Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install gcovr
        run: python -m pip install gcovr==8.6

      - name: Configure coverage build
        run: >
          cmake
          -S .
          -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DDP_CUDA_BUILD_TESTS=ON
          -DDP_CUDA_ENABLE_COVERAGE=ON

      - name: Build coverage configuration
        run: cmake --build build-coverage

      - name: Run coverage tests
        run: >
          ctest
          --test-dir build-coverage
          --output-on-failure

      - name: Generate coverage report
        run: >
          gcovr
          --root .
          --filter include/dpcuda
          --filter src
          --exclude build-coverage
          --print-summary
          --cobertura-pretty
          --output coverage.xml
          build-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: coverage.xml
          use_oidc: true
