name: CPU CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        build_type:
          - Debug
          - Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure on Ubuntu
        if: runner.os == 'Linux'
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DDP_CUDA_BUILD_TESTS=ON

      - name: Configure on Windows
        if: runner.os == 'Windows'
        run: >
          cmake
          -S .
          -B build
          -DDP_CUDA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: >
          ctest
          --test-dir build
          -C ${{ matrix.build_type }}
          --output-on-failure
